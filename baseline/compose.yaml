name: kvlt-baseline

services:
  key-vault:
    build:
      context: .
      dockerfile: Dockerfile
    image: kvlt-baseline:local
    ports:
      - "8080:8080"
    environment:
      KVLT_HTTP_ADDR: ":8080"
      KVLT_STATE_DB: "/var/lib/key-vault/security-state.db"
      KVLT_TPM_PROVIDER: "tpm2"
      KVLT_TPM_STATE_DIR: "/var/lib/key-vault/tpm"
      TPM2TOOLS_TCTI: "device:/dev/tpmrm0"
      KVLT_LOG_LEVEL: "INFO"
      KVLT_STATIC_TOKENS: >-
        [{"token":"mission-data-token-baseline","tenant_id":"t-default","scopes":["ccsds:tc:protect","ccsds:aos:unprotect"],"roles":["data"],"plane":"data"},{"token":"mission-console-token-baseline","tenant_id":"t-default","scopes":["ccsds:tc:protect","ccsds:aos:unprotect","audit:read","ops:read"],"roles":["admin","data","ops"],"planes":["management","data","ops"]}]
    devices:
      - "/dev/tpmrm0:/dev/tpmrm0"
    volumes:
      - kvlt_state:/var/lib/key-vault
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  kvlt_state:
