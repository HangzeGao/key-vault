name: kvlt-baseline

services:
  key-vault:
    build:
      context: .
      dockerfile: Dockerfile
    image: kvlt-baseline:local
    ports:
      - "8081:8081"
    environment:
      KVLT_OPS_ADDR: "127.0.0.1:8080"
      KVLT_DATA_ADDR: ":8081"
      KVLT_STATE_DB: "/var/lib/key-vault/security-state.db"
      KVLT_TPM_PROVIDER: "tpm2"
      KVLT_TPM_STATE_DIR: "/var/lib/key-vault/tpm"
      TPM2TOOLS_TCTI: "device:/dev/tpmrm0"
      KVLT_LOG_LEVEL: "INFO"
      KVLT_ACCESS_TOKENS: >-
        [{"token":"mission-data-token-baseline-000001","tenant_id":"t-default","scopes":["ccsds:tc:protect","ccsds:downlink:unprotect"],"plane":"data"},{"token":"mission-console-token-baseline-0001","tenant_id":"t-default","scopes":["audit:read","ops:read"],"plane":"ops"}]
    devices:
      - "/dev/tpmrm0:/dev/tpmrm0"
    volumes:
      - kvlt_state:/var/lib/key-vault
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  kvlt_state:
